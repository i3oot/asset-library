name: Build and Publish Docker Image

on:
  workflow_dispatch:
  push:
    branches: ["main", "fix/**"]
    tags: ["v*"] # Optional: publish on version tags too

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: asset_library_test
          POSTGRES_DB: asset_library_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U asset_library_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://asset_library_test@127.0.0.1:5432/asset_library_test
      OTEL_SDK_DISABLED: "true"
      DO_NOT_TRACK: "1"

    permissions:
      contents: read
      packages: write # Required for GHCR publishing

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install isolated renderer test browser
        run: |
          npm ci
          npx playwright-core install --with-deps chromium
          node --input-type=module -e "import { chromium } from 'playwright-core'; console.log('TEST_CHROMIUM_PATH=' + chromium.executablePath())" >> "$GITHUB_ENV"

      - name: Validate and test
        run: |
          npm run check
          npm test

      - name: Extract version from tag
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "Version extracted: $VERSION"
          else
            echo "No version tag detected"
          fi

      - name: Update package.json version
        if: steps.version.outputs.version != ''
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          jq --arg version "$VERSION" '.version = $version' package.json > package.json.tmp
          mv package.json.tmp package.json
          echo "Updated package.json to version $VERSION"
          cat package.json | grep version

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=ref,event=tag

      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runner
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Build and push isolated model renderer
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: thumbnail-renderer
          push: true
          tags: ghcr.io/${{ github.repository }}-renderer:sha-${{ github.sha }}
